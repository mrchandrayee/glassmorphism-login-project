<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#d8ddeb" />
  <title>Welcome Back — Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scene-orb orb-one"></div>
  <div class="scene-orb orb-two"></div>
  <div class="scene-orb orb-three"></div>
  <main class="page">
    <section class="login-card" aria-labelledby="heading">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19c.5-3.2 2.8-5 6.5-5s6 1.8 6.5 5"/></svg>
      </div>
      <p class="eyebrow">GOOD TO SEE YOU</p>
      <h1 id="heading">Welcome back</h1>
      <p class="subheading">Please enter your details to sign in.</p>

      <form id="loginForm" novalidate>
        <label class="field-label" for="email">Email address</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4.5 7 7.5 6 7.5-6"/></svg>
          <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required />
        </div>
        <label class="field-label password-label" for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10" width="15" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required minlength="6" />
          <button class="toggle-password" type="button" aria-label="Show password" title="Show password">
            <svg viewBox="0 0 24 24"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </div>
        <div class="form-options">
          <label class="remember"><input type="checkbox" id="remember" /> <span>Remember me</span></label>
          <a href="#" id="forgotLink">Forgot password?</a>
        </div>
        <button class="sign-in" type="submit">Sign in <span aria-hidden="true">→</span></button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <div class="separator"><span></span><small>OR CONTINUE WITH</small><span></span></div>
      <div class="socials">
        <button type="button" class="social google" aria-label="Continue with Google"><b>G</b></button>
        <button type="button" class="social apple" aria-label="Continue with Apple"><svg viewBox="0 0 24 24"><path d="M16.7 12.8c0-2 1.6-3 1.7-3.1-1-1.4-2.5-1.6-3-1.6-1.3-.1-2.5.8-3.2.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.7 1.1 8.9.7 1.1 1.6 2.3 2.7 2.2 1.1 0 1.5-.7 2.8-.7s1.7.7 2.8.7c1.2 0 1.9-1.1 2.6-2.2.8-1.2 1.1-2.4 1.1-2.5-.1 0-2.1-.8-2.1-3.9ZM14.6 6.7c.6-.8 1-1.8.9-2.8-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.8-1 2.7 1 .1 2.1-.5 2.8-1.3Z"/></svg></button>
        <button type="button" class="social facebook" aria-label="Continue with Facebook">f</button>
      </div>
      <p class="signup">Don't have an account? <a href="#" id="signupLink">Sign up</a></p>
    </section>
    <p class="footer-note">SECURE SIGN IN <span>•</span> YOUR PRIVACY MATTERS</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
